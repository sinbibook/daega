<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 렌더 게이트: 매핑 전 화면 / 랜딩으로 넘어가기 전 index 깜빡임 방지 (매핑 완료 시 페이드인)
         해제: IndexMapper.map 완료 시 __tplReveal (랜딩 판단 중엔 index-mapper.js 조기 랜딩 가드가 붙잡아 둔다) -->
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:,">
    <title>나주 대가 한옥 펜션 - 홈</title>

      rel="stylesheet"
      href="https://unpkg.com/swiper/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/popup.css">
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />

  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/11/12/0va89N2ykYlD.jpg" />
  <meta property="og:url" content="https://daega.kr" />

  <body>
    <div class="wrapper">
<div class="container">
        <div class="con0" data-aos="fade-up">
          <div class="swiper-container">
            <!-- MAPPER: customFields.pages.index.sections[0].hero.images[isSelected] -->
            <div class="swiper-wrapper">
            </div>
            <div class="swiperNavi">
              <div class="swiper-button-prev">
                <img src="images/icon_arrow_left_1.png" alt="" />

              </div>
              <div class="bar"></div>
              <div class="swiper-button-next">
                Next

              </div>
            </div>
          </div>
          <!-- MAPPER: property.name (숙소 한글명) -->
          <div class="tx1"></div>
        </div>
        <!-- MAPPER: customFields.pages.index.sections[0].signature (title + images[isSelected].url) -->
        <div class="con1">

            </div>

        </div>

            <div class="conTitle" data-aos="fade-up">
              <div class="subTitle">
              </div>
              <div class="title"></div>
            </div>
            <!-- MAPPER: rooms slider -->
            <div class="swiper-container" data-aos="fade-up">
              <div class="swiper-wrapper">
              </div>
              <div class="swiperNavi">
                <div class="swiper-button-prev">

          </div>
        </div>
        <!-- MAPPER: customFields.pages.index.sections[0].essence (title + tags) -->
        <!-- MAPPER: property.facilities[].images[isSelected] (슬라이드) -->
        <div class="con4">
          <div class="w1440">
            <div class="conTitle">
              <div class="subTitle">
              </div>
              <div class="title"></div>
              <div class="swiperNavi">
                <div class="swiper-button-prev">
                  <img src="images/icon_arrow_left_2.png" alt="" />

                <div class="swiper-button-next">
                  <img src="images/icon_arrow_right_2.png" alt="" />
                </div>
              </div>
            </div>
            <!-- MAPPER: facilities slider -->
            <div class="swiper-container">
              <div class="swiper-wrapper">
              </div>
            </div>
          </div>
        </div>
        <!-- MAPPER: customFields.pages.index.sections[0].closing.images[isSelected] + closing.title -->
        <div class="con5">
          <div class="img" data-aos="fade-up"></div>
          <div class="w1440">
            <div class="tx travelFont" data-aos="fade-up">
            </div>
          </div>
        </div>
      </div>
    </div>
